<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="kx-core" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
  </defs>

  <g stroke="url(#kx-grad)" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="30"/>
    <line x1="100" y1="100" x2="160.6" y2="65"/>
    <line x1="100" y1="100" x2="160.6" y2="135"/>
    <line x1="100" y1="100" x2="100" y2="170"/>
    <line x1="100" y1="100" x2="39.4" y2="135"/>
    <line x1="100" y1="100" x2="39.4" y2="65"/>
  </g>

  <polygon points="100,30 160.6,65 160.6,135 100,170 39.4,135 39.4,65"
