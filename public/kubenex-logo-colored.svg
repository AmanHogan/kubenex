  <g fill="#ffffff" stroke="url(#kx-grad)" stroke-width="3">
    <circle cx="100" cy="30" r="7"/>
    <circle cx="160.6" cy="65" r="7"/>
    <circle cx="160.6" cy="135" r="7"/>
    <circle cx="100" cy="170" r="7"/>
    <circle cx="39.4" cy="135" r="7"/>
